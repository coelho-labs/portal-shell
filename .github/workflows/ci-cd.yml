name: CI/CD Pipeline - Portal Shell

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 🧪 JOB 1: Quality and Tests (Fail Fast)
  test-and-validate:
    name: Validate, Test & Mutation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=./reports/unit-tests.xml
        env:
          GITHUB_STEP_SUMMARY: '' # Impede que o Vitest injete resumos parciais no Summary do GitHub

      - name: Run Mutation Tests
        run: npm run test:mutation
        env:
          GITHUB_STEP_SUMMARY: '' # Impede que os sub-runs do Stryker poluam o Summary do GitHub

  # 🚀 JOB 2: Deploy on Vercel
  deploy-to-vercel:
    name: Deploy to Vercel
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
